name: Commercial Staging Release Candidate

on:
  push:
    branches:
      - commercial-v1
  workflow_dispatch:
    inputs:
      version:
        description: Release-candidate version such as 1.0.0-rc1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: commercial-staging-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-candidate:
    name: Build deterministic staging RC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require commercial-v1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/commercial-v1"

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install locked commercial dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r commercial/requirements.lock

      - name: Verify staging lab foundation
        run: python commercial/tools/verify_staging_lab_foundation.py

      - name: Resolve release-candidate version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${REQUESTED_VERSION}"
          else
            version="rc-${GITHUB_SHA:0:12}"
          fi
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          echo "value=$version" >>"$GITHUB_OUTPUT"

      - name: Build and verify staging release candidate
        shell: bash
        env:
          PYTHONPATH: commercial
          RC_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          output="sagar-monitor-staging-${RC_VERSION}.zip"
          python commercial/tools/run_staging_lab.py build-rc \
            --repository-root . \
            --output "$output" \
            --version "$RC_VERSION" \
            --source-commit "$GITHUB_SHA"
          python commercial/tools/run_staging_lab.py verify-rc --package "$output"
          sha256sum "$output" >"${output}.sha256"

      - name: Upload verified staging release candidate
        uses: actions/upload-artifact@v4
        with:
          name: sagar-monitor-staging-${{ steps.version.outputs.value }}
          path: |
            sagar-monitor-staging-${{ steps.version.outputs.value }}.zip
            sagar-monitor-staging-${{ steps.version.outputs.value }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
