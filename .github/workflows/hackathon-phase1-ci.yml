name: Hackathon Phase 1 CI

on:
  push:
    branches:
      - main
      - 'hackathon/**'
  pull_request:
    paths:
      - 'hackathon/**'
      - 'commercial/**'
      - '.github/workflows/hackathon-phase1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackathon-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1:
    name: Four-service stack and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONITOR_ADMIN_PASSWORD: CI-Hackathon-Only-2026!
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Compile Monitor and hackathon Python
        run: |
          python -m compileall -q commercial
          python -m py_compile hackathon/services/ai_ops/app.py
          python -m py_compile hackathon/services/dora_collector/app.py

      - name: Run hackathon unit tests
        run: python -m unittest discover -s hackathon/tests -v

      - name: Validate shell bootstrap
        run: bash -n hackathon/services/monitor/entrypoint.sh

      - name: Validate Docker Compose
        run: docker compose -f hackathon/docker-compose.yml config --quiet

      - name: Build all four application images
        run: docker compose -f hackathon/docker-compose.yml build --pull

      - name: Start complete System Monitor hackathon stack
        run: docker compose -f hackathon/docker-compose.yml up -d

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            monitor=0; ai=0; dora=0; ui=0
            curl -kfsS https://127.0.0.1:8443/api/v1/health/live >/dev/null && monitor=1 || true
            curl -fsS http://127.0.0.1:8081/healthz >/dev/null && ai=1 || true
            curl -fsS http://127.0.0.1:8082/healthz >/dev/null && dora=1 || true
            curl -fsS http://127.0.0.1:8080/ >/dev/null && ui=1 || true
            if [[ $monitor -eq 1 && $ai -eq 1 && $dora -eq 1 && $ui -eq 1 ]]; then
              echo 'All four application components are healthy.'
              exit 0
            fi
            sleep 2
          done
          echo 'Application stack did not become healthy.' >&2
          docker compose -f hackathon/docker-compose.yml ps
          exit 1

      - name: Prove AI inference and DORA calculation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST http://127.0.0.1:8081/v1/analyze \
            -H 'Content-Type: application/json' \
            -d '{"machine_id":"ci-machine","metrics":{"cpu_pct":98,"memory_pct":97,"disk_pct":96,"latency_ms":320,"packet_loss_pct":9},"history":[{"cpu_pct":40,"memory_pct":60,"disk_pct":70,"latency_ms":30,"packet_loss_pct":0.1},{"cpu_pct":41,"memory_pct":61,"disk_pct":70,"latency_ms":31,"packet_loss_pct":0.1},{"cpu_pct":39,"memory_pct":60,"disk_pct":70,"latency_ms":32,"packet_loss_pct":0.1},{"cpu_pct":40,"memory_pct":59,"disk_pct":70,"latency_ms":30,"packet_loss_pct":0.1},{"cpu_pct":42,"memory_pct":60,"disk_pct":70,"latency_ms":31,"packet_loss_pct":0.1}]}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['anomaly_score'] >= 60; print(d)"

          started=$(date -u -d '10 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')
          deployed=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          curl -fsS -X POST http://127.0.0.1:8082/v1/deployments \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"ci-${GITHUB_RUN_ID}\",\"service\":\"monitor\",\"commit_sha\":\"${GITHUB_SHA}\",\"environment\":\"production\",\"change_started_at\":\"${started}\",\"deployed_at\":\"${deployed}\",\"status\":\"success\",\"rollout_strategy\":\"canary\"}" >/dev/null
          curl -fsS 'http://127.0.0.1:8082/v1/metrics?environment=production&days=30' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['successful_deployments'] >= 1; print(d)"

      - name: Show container status
        if: always()
        run: docker compose -f hackathon/docker-compose.yml ps

      - name: Show logs on failure
        if: failure()
        run: docker compose -f hackathon/docker-compose.yml logs --no-color

      - name: Tear down CI stack
        if: always()
        run: docker compose -f hackathon/docker-compose.yml down -v --remove-orphans
